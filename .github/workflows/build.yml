name: Build WristBrowser APK and RPK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Download original Xiaomi XMS SDK
        run: |
          set -euo pipefail
          mkdir -p phone/libs
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/open-vela/packages_apps/dev/wearable/interconnect_image_demo/android_program/libs/xms-wearable-lib_1.4_release.aar \
            --output phone/libs/xms-wearable-lib_1.4_release.aar
          test -s phone/libs/xms-wearable-lib_1.4_release.aar
      - name: Configure shared Android and Vela signing certificate
        id: android-signing
        env:
          VELA_PRIVATE_KEY: ${{ secrets.VELA_PRIVATE_KEY }}
          VELA_CERTIFICATE: ${{ secrets.VELA_CERTIFICATE }}
          ANDROID_KEYSTORE_PASSWORD: wristbrowser-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "$VELA_PRIVATE_KEY" ] || [ -z "$VELA_CERTIFICATE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Shared release signing secrets are missing; skipping Android release APK."
            exit 0
          fi
          mkdir -p phone/sign
          printf '%s\n' "$VELA_PRIVATE_KEY" > phone/sign/private.pem
          printf '%s\n' "$VELA_CERTIFICATE" > phone/sign/certificate.pem
          openssl pkey -in phone/sign/private.pem -check -noout
          openssl x509 -in phone/sign/certificate.pem -noout -subject -dates
          KEY_HASH="$(openssl pkey -in phone/sign/private.pem -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          CERT_HASH="$(openssl x509 -in phone/sign/certificate.pem -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          test "$KEY_HASH" = "$CERT_HASH"
          openssl pkcs12 -export \
            -inkey phone/sign/private.pem \
            -in phone/sign/certificate.pem \
            -name wristbrowser \
            -out phone/signing.p12 \
            -passout env:ANDROID_KEYSTORE_PASSWORD
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/phone/signing.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: gradle :phone:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WristBrowser-Android-Debug-APK
          path: phone/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build release APK with the exact Vela RPK certificate
        if: steps.android-signing.outputs.ready == 'true'
        run: gradle :phone:assembleRelease --stacktrace
      - name: Verify Android APK certificate matches Vela certificate
        if: steps.android-signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          APK="$(find phone/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          EXPECTED="$(openssl x509 -in phone/sign/certificate.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | awk 'tolower($0) ~ /certificate sha-256 digest/ { sub(/^.*digest[^0-9a-fA-F]*/, ""); print; exit }' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "APK certificate fingerprint does not match the Vela certificate."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "Verified: Android APK and Vela RPK use the same SHA-256 certificate."
      - uses: actions/upload-artifact@v4
        if: steps.android-signing.outputs.ready == 'true'
        with:
          name: WristBrowser-Android-Release-APK
          path: phone/build/outputs/apk/release/*.apk
          if-no-files-found: error

  vela:
    name: Build Xiaomi Vela RPK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install Vela dependencies
        working-directory: watch
        run: npm install --no-audit --no-fund
      - name: Build Xiaomi Vela debug RPK
        working-directory: watch
        run: npm run build
      - name: Verify and stage debug RPK
        working-directory: watch
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE/watch/dist" -type f -name '*.rpk' -print
          RPK="$(find "$GITHUB_WORKSPACE/watch/dist" -type f -name '*.debug.*.rpk' -print -quit)"
          test -n "$RPK"
          mkdir -p "$GITHUB_WORKSPACE/watch/artifacts"
          cp "$RPK" "$GITHUB_WORKSPACE/watch/artifacts/"
      - name: Upload Xiaomi Watch debug RPK
        uses: actions/upload-artifact@v4
        with:
          name: WristBrowser-Xiaomi-Vela-Debug-RPK
          path: watch/artifacts/*.debug.*.rpk
          if-no-files-found: error
      - name: Configure Vela signing certificate
        id: signing
        working-directory: watch
        env:
          VELA_PRIVATE_KEY: ${{ secrets.VELA_PRIVATE_KEY }}
          VELA_CERTIFICATE: ${{ secrets.VELA_CERTIFICATE }}
        run: |
          set -euo pipefail
          if [ -z "$VELA_PRIVATE_KEY" ] || [ -z "$VELA_CERTIFICATE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; skipping release build."
            exit 0
          fi
          mkdir -p sign
          printf '%s\n' "$VELA_PRIVATE_KEY" > sign/private.pem
          printf '%s\n' "$VELA_CERTIFICATE" > sign/certificate.pem
          openssl pkey -in sign/private.pem -check -noout
          openssl x509 -in sign/certificate.pem -noout -subject -dates
          KEY_HASH="$(openssl pkey -in sign/private.pem -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          CERT_HASH="$(openssl x509 -in sign/certificate.pem -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          test "$KEY_HASH" = "$CERT_HASH"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build Xiaomi Vela release RPK
        if: steps.signing.outputs.ready == 'true'
        working-directory: watch
        run: npm run release
      - name: Verify and stage release RPK
        if: steps.signing.outputs.ready == 'true'
        working-directory: watch
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE/watch/dist" -type f -name '*.rpk' -print
          RPK="$(find "$GITHUB_WORKSPACE/watch/dist" -type f -name '*.release.*.rpk' -print -quit)"
          test -n "$RPK"
          mkdir -p "$GITHUB_WORKSPACE/watch/artifacts"
          cp "$RPK" "$GITHUB_WORKSPACE/watch/artifacts/"
      - name: Upload Xiaomi Watch release RPK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WristBrowser-Xiaomi-Vela-Release-RPK
          path: watch/artifacts/*.release.*.rpk
          if-no-files-found: error
      - name: Explain missing release signing secrets
        if: steps.signing.outputs.ready != 'true'
        run: |
          echo 'Release RPK was not built: configure repository Actions secrets VELA_PRIVATE_KEY and VELA_CERTIFICATE.'
          echo 'The debug RPK was built and uploaded separately.'
